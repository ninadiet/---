name: Measure Post Engagement (Ron Step 6)

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Threads Post ID to measure'
        required: true
      issue_number:
        description: 'GitHub Issue number for this post'
        required: true

permissions:
  issues: write
  contents: write   # 手動計測のバズ判定を残すため（2026-08-25）

env:
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

jobs:
  measure-engagement:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: Step 6 - Ron Fetches Engagement Data
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            mkdir -p credentials
            echo "$GOOGLE_CREDENTIALS_JSON" > credentials/sheets_service_account.json
            export GOOGLE_CREDENTIALS_PATH=credentials/sheets_service_account.json
          fi
          python scripts/ron_fetch.py \
            --post-id "${{ github.event.inputs.post_id }}" \
            --issue-number "${{ github.event.inputs.issue_number }}"

      # 📝 学習データのコミット（2026-08-25 全面改訂）
      # ⚠️ このステップは必ず**workflowの最後**に置くこと。
      #    以前は途中に置かれており、後段のステップが書くファイル
      #    （post_history.jsonl 等）がコミットされず毎日消えていた
      #    （診断で発覚。「git add はあるのに実行順序が逆」という形の再発だった）。
      # ⚠️ continue-on-error と `push ||` も外さないこと。
      #    途中で失敗しても本編を殺さない・push衝突時は諦めて翌日に任せる。
      - name: 📝 学習データをコミット（最終ステップ・順序を変えない）
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add operation/knowledge/kb_sys_ref_v001.md 2>/dev/null || true
          git add operation/memory/post_history.jsonl 2>/dev/null || true
          git add operation/memory/type_scores.csv 2>/dev/null || true
          git add operation/strategy/type_pool.json 2>/dev/null || true
          git add operation/weekly/type_report.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 学習データを記録（重複回避・型の成績）"
            git push || echo "push できませんでした（今回ぶんの学習記録は翌日に持ち越し。処理は続行）"
          fi

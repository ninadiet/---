name: GAS Watchdog - Daily Cycle Monitor

# 目的: 外部スケジューラ(GAS)が 05:00 JST に daily-cycle を起動できなかった場合に
#       06:30 JST で検知し、(1) daily-cycle を自動起動 (2) Discord に通知 する番犬。
#
# ⚠️ 通知の本文は .github/workflows の中に Python を直書きしないこと。
#    `run: |` の中にヒアドキュメントで Python を貼ると、Python 側がインデント0で
#    書かれた瞬間に YAML のブロックスカラーがそこで終わってしまい、
#    ワークフロー全体が "Invalid workflow file" になる（＝1行も動かない）。
#    通知の中身は scripts/utils/notify_watchdog.py に置いてある。そちらを直すこと。

on:
  schedule:
    - cron: '30 21 * * *'  # 06:30 JST（GAS 05:00 発火後の確認）
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: write

env:
  DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check today's cycle status
        id: check_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "Checking daily cycle status for $TODAY..."

          ISSUE_NUMBER=$(gh api "repos/${{ github.repository }}/issues?labels=daily-operation&state=all&per_page=5" \
            --jq ".[] | select(.title | contains(\"$TODAY\")) | .number" 2>/dev/null | head -1 || echo "")

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "status=no_issue" >> "$GITHUB_OUTPUT"
            echo "No issue found for today"
          else
            echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
            HERMIONE_COMMENT=$(gh api "repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments" \
              --jq '.[] | select(.body | contains("ハーマイオニーより")) | .body' 2>/dev/null | head -1 || echo "")

            if [ -n "$HERMIONE_COMMENT" ]; then
              echo "status=ok" >> "$GITHUB_OUTPUT"
              echo "Hermione already done - all good"
            else
              echo "status=hermione_not_done" >> "$GITHUB_OUTPUT"
              echo "Hermione not done yet - triggering recovery"
            fi
          fi

      - name: All good - exit early
        if: steps.check_status.outputs.status == 'ok'
        run: echo "All good - Hermione completed today's cycle"

      # 時間帯ガード: 自動復旧は朝（JST 06:00-09:00）だけに限定する。
      # 深夜・日中に手動テストや再実行でこのワークフローが動いても、
      # daily-cycle を勝手に起動しない（意図しない投稿を防ぐ）。通知は時間帯に関係なく送る。
      - name: Time window guard (JST 06:00-09:00 のみ自動復旧)
        id: timeguard
        run: |
          JST_HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "$JST_HOUR" -ge 6 ] && [ "$JST_HOUR" -le 9 ]; then
            echo "auto_recover=true" >> "$GITHUB_OUTPUT"
            echo "Watchdog: 朝の時間帯（${JST_HOUR}時）→ 自動復旧モード"
          else
            echo "auto_recover=false" >> "$GITHUB_OUTPUT"
            echo "Watchdog: 朝以外（${JST_HOUR}時）→ 通知のみ・自動復旧は行わない"
          fi

      - name: Auto-recover - trigger daily-cycle
        if: steps.check_status.outputs.status != 'ok' && steps.timeguard.outputs.auto_recover == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering daily-cycle recovery..."
          gh api "repos/${{ github.repository }}/actions/workflows/daily-cycle.yml/dispatches" \
            -X POST \
            -f ref=${{ github.ref_name }} \
            -f inputs='{}' || echo "Failed to trigger daily-cycle"

      - name: Notify Discord - watchdog alert
        if: steps.check_status.outputs.status != 'ok'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # notify_watchdog.py はこの名前で状態を読む（status= の値をそのまま渡す）
          WATCHDOG_STATUS: ${{ steps.check_status.outputs.status }}
        run: |
          pip install -q requests
          python scripts/utils/notify_watchdog.py

      - name: Manual test info (off-hours)
        if: steps.check_status.outputs.status != 'ok' && steps.timeguard.outputs.auto_recover == 'false'
        run: |
          echo "::notice::朝以外の時間帯のため、自動復旧はスキップしました（深夜・日中の意図しない投稿を防止）"
          echo "もし意図的に daily-cycle を起動したい場合は、Actions ページから daily-cycle を手動で起動してください"

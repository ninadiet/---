name: Snape Daily Monitor (Quality + Health Watch)

on:
  # 毎日の運用中に2時間ごとに監視（7:00〜12:00 JST = 22:00〜03:00 UTC）
  # ※ Gemini API 無料枠節約のため12回/日→6回/日に削減
  schedule:
    - cron: '13 22,23,0,1,2,3 * * *' # 7:13/8:13/9:13/10:13/11:13/12:13 JST ※2時間おき

  # 手動実行も可能（任意のタイミングで）
  workflow_dispatch:
    inputs:
      mode:
        description: '監視モード: health / quality / full'
        required: false
        default: 'full'

permissions:
  issues: write
  contents: read

jobs:
  snape-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt

      - name: "🔒 月次トークン認証"
        env:
          HOG_MONTHLY_TOKEN: ${{ secrets.HOG_MONTHLY_TOKEN }}
        run: cd scripts && python auth_gate.py

      - name: Restore auth credentials
        run: |
          mkdir -p operation/auth
          echo "${{ secrets.HOG_ACCESS_KEY }}" | base64 -d > operation/auth/access_HOG-2026-06.key

      - name: Run Snape Daily Monitor
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:         ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/snape_daily.py --mode ${{ github.event.inputs.mode || 'full' }}
